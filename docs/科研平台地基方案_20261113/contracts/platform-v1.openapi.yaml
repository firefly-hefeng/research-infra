components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rmp_session
      description: 目标统一具名会话 Secure HttpOnly SameSite；与当前统一入口共享口令区分
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 目标服务账号 短时效 audience与最小scope 不使用共享管理员口令
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 主体+方法+规范路由+键唯一；保存请求体摘要与原响应至少7天 同键异体409
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: 强ETag 例如 "rev-3" 变更前校验 缺失428 冲突412
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 16
      description: Cookie写请求必须；Bearer服务调用不要求 请求来源仍需校验
  schemas:
    Problem:
      type: object
      additionalProperties: false
