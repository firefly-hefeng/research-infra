  /me:
    get:
      summary: 当前认证身份与项目角色
      operationId: get_me
      tags:
      - me
      description: 此接口为目标契约 尚未部署。
      x-implementation-status: planned
      x-phase: P1
      x-required-permission: member
      parameters: []
      responses:
        '200':
          description: 成功 首次创建为201 同幂等请求重放原状态码与原响应
          headers:
            X-Request-Id:
              schema: &id001
                type: string
                description: 稳定不透明标识 不从路径或姓名派生
                minLength: 3
                maxLength: 128
                pattern: ^[A-Za-z0-9._:-]+$
            ETag:
              schema:
                type: string
                description: 强 ETag 对应当前修订号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400': &id002
          description: 参数或状态转换无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id003
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id004
          description: 项目角色或用途授权不足
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404': &id005
          description: 不可见或不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': &id006
          description: 幂等冲突 内容漂移或版本目标冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412': &id007
          description: If-Match 版本不匹配
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413': &id008
          description: 原件超过限制
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422': &id009
          description: 业务校验或发布门禁未通过
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428': &id010
          description: 缺少 If-Match
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': &id011
          description: 限流
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503': &id012
          description: 依赖 挂载或容量不可用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
