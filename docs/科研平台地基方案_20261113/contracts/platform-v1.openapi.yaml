          - NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - VERSION_CONFLICT
          - PRECONDITION_REQUIRED
          - POLICY_BLOCKED
          - MOUNT_UNAVAILABLE
          - CAPACITY_INSUFFICIENT
          - CONTENT_DRIFT
