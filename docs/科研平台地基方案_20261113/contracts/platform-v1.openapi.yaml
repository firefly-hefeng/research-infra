info:
  title: 科研管理平台目标接口契约
  version: 1.0.0-proposed
  description: 2026-11-13方案设计。所有 /api/v1 路由均为待实现目标，不表示当前服务器已部署。现有接口另见 legacy-live.openapi.json。默认单主协调器，应用数据库在101本地盘；跨中心只通过受认证接口写入。
servers:
- url: https://rmp.wuwangwo.top/api/v1
